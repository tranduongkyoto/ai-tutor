<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TD2 Flashcards</title>
<style>
:root{
  --bg:#EDF0F3; --paper:#FFFFFF; --ink:#1B2230; --muted:#5B6676; --line:#D5DBE3; --soft:#F5F7F9;
  --accent:#23507A; --accent-ink:#FFFFFF;
  --good:#1E7A46; --good-bg:#E6F4EC; --bad:#B42318; --bad-bg:#FBEAE8; --tip:#FFF6D6; --tip-line:#E8B400;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#141922; --paper:#1C2330; --ink:#E6EAF0; --muted:#9AA5B4; --line:#2E3848; --soft:#222A38;
    --accent:#86B6E6; --accent-ink:#0E1620;
    --good:#5CC98A; --good-bg:rgba(92,201,138,.12); --bad:#FF8A7A; --bad-bg:rgba(255,138,122,.12); --tip:rgba(255,214,90,.10); --tip-line:#C99A12;
    color-scheme:dark;
  }
}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
button{font:inherit;color:inherit;cursor:pointer}
code{background:var(--soft);padding:1px 5px;border-radius:4px;font-size:13px}
.topbar{display:flex;align-items:center;gap:12px;padding:10px 18px;background:var(--paper);border-bottom:1px solid var(--line);flex-wrap:wrap}
.brand{font-weight:700;font-size:17px;margin-right:auto}
.brand small{font-weight:500;color:var(--muted);font-size:13px;margin-left:8px}
.wrap{max-width:820px;margin:24px auto;padding:0 16px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:22px 24px;margin-bottom:16px}
.btn{border:1px solid var(--line);background:var(--paper);padding:8px 16px;border-radius:8px;font-size:14px;font-weight:500}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-size:13.5px;background:var(--soft);cursor:pointer;user-select:none}
.chip input{margin:0}
.muted{color:var(--muted);font-size:13.5px}
.bar{height:6px;background:var(--soft);border-radius:999px;overflow:hidden;margin:6px 0 14px}
.bar i{display:block;height:100%;background:var(--accent);transition:width .2s}
.meta{display:flex;justify-content:space-between;color:var(--muted);font-size:13px}
.q{font-size:17px;font-weight:600;margin:6px 0 16px}
.opt{display:flex;gap:12px;width:100%;text-align:left;border:1.5px solid var(--line);background:var(--paper);border-radius:10px;padding:12px 14px;margin-bottom:10px;font-size:15px}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt b{flex:none;width:26px;height:26px;border-radius:50%;background:var(--soft);display:grid;place-items:center;font-size:13px}
.opt.ok{border-color:var(--good);background:var(--good-bg)}
.opt.no{border-color:var(--bad);background:var(--bad-bg)}
.opt:disabled{cursor:default}
.fb{border-left:4px solid var(--tip-line);background:var(--tip);border-radius:6px;padding:10px 14px;margin-top:6px}
.fb .v{font-weight:700}
.fb .v.ok{color:var(--good)} .fb .v.no{color:var(--bad)}
.big{font-size:40px;font-weight:800;line-height:1.1}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line)}
.miss{border-top:1px solid var(--line);padding:10px 0}
.miss:first-child{border-top:0}
.tag{font-size:12px;color:var(--muted)}
.copy{font-family:ui-monospace,monospace;font-size:13px;background:var(--soft);padding:8px 10px;border-radius:6px;word-break:break-all}
.good{color:var(--good)} .badc{color:var(--bad)}
</style>
</head>

 ["G7", "Mitigate DDoS on a single-VPC trading platform and notify team (select two).", "<code>AWS WAF</code> custom rules + <code>Shield Advanced</code> DDoS detection and monitoring.", "Network Firewall rule-based filtering.", "Network Firewall centrally manages rules across many VPCs and accounts; this is one VPC.", "TD2 Q51", 1],
 ["G8", "Store and retrieve DB password securely; rotate every 60 days.", "Secrets Manager secret; app retrieves at launch; dynamic reference for <code>MasterUserPassword</code>.", "Secrets Manager secret passed to instance via UserData with <code>Ref</code>.", "UserData and <code>Ref</code> expose the secret; dynamic reference plus runtime retrieval keeps it protected.", "TD2 Q67", 1],
 ["H1", "Sync on-premises patch baselines to EC2 and automate patch schedule, least effort.", "Patch Manager with baselines, SSM Agent on instances, scheduling via Maintenance Windows.", "Patch Manager scheduled with Lambda jobs and Run Command.", "Maintenance Windows is the built-in scheduler; custom Lambda scheduling adds needless effort.", "TD2 Q28", 0],
 ["H2", "Give a compliance auditor access to AWS resource logs.", "Enable CloudTrail logging; create read-only IAM user for the auditor.", "Create IAM role for the auditor and attach it to EC2, S3, and DynamoDB.", "Roles attach to resources that assume them, not to external auditors; CloudTrail plus read-only access suits audits.", "TD2 Q32", 0],
 ["H3", "Auto-recover EC2 on hardware failure keeping same IP address.", "CloudWatch alarm on <code>StatusCheckFailed_System</code> with EC2 recover action.", "Elastic IP plus alarm that stops and starts the instance.", "Recover action keeps instance ID, private IP and Elastic IP; stop/start loses ephemeral state.", "TD2 Q61", 0],
].map(([id,q,ok,bad,why,src,rep]) => ({id,sec:id[0],q,ok,bad,why,src,rep:!!rep}));

const SECTIONS = {"A": "Identity & governance", "B": "Networking & hybrid", "C": "Edge, DNS & global delivery", "D": "Compute, containers & deployment", "E": "Data, analytics & app integration", "F": "Storage, migration & DR", "G": "Security", "H": "Monitoring, cost & operations"};
const STORE = "sap-td2-flashcards-rounds";
const app = document.getElementById("app");
let run = null; // {deck, i, answers:[{id,correct}], order:[0|1], picked}

const loadRounds = () => JSON.parse(localStorage.getItem(STORE) || "[]");
const saveRounds = r => localStorage.setItem(STORE, JSON.stringify(r));
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const byId = id => CARDS.find(c => c.id === id);
const pct = (a, b) => b ? Math.round(a * 100 / b) : 0;
const today = () => new Date().toISOString().slice(0, 10);

/* Home: choose which cards to drill, see round history. */
function home() {
  run = null;
  const rounds = loadRounds();
  const last = rounds[rounds.length - 1];
  const secChips = Object.entries(SECTIONS).map(([k, v]) =>
    `<label class="chip"><input type="checkbox" name="sec" value="${k}" checked>${k}. ${v} (${CARDS.filter(c => c.sec === k).length})</label>`).join("");
  const hist = rounds.length ? `<table><tr><th>#</th><th>Date</th><th>Set</th><th>Score</th><th>Missed</th></tr>${
    rounds.map((r, i) => `<tr><td>${i + 1}</td><td>${r.date}</td><td>${r.set}</td><td>${r.score}/${r.total} (${pct(r.score, r.total)}%)</td><td class="tag">${r.missed.join(", ") || "—"}</td></tr>`).join("")
  }</table><div class="row" style="margin-top:10px"><button class="btn" id="clearBtn">Clear history</button></div>` : `<p class="muted">No rounds yet.</p>`;
  app.innerHTML = `
  <div class="card">
    <h2 style="margin:0 0 4px">Start a round</h2>
    <p class="muted">${CARDS.length} cards from your own wrong/right answers. Pick one of two options; feedback after each card, summary at the end.</p>
    <div class="row" style="margin:12px 0">${secChips}</div>
    <div class="row" style="margin-bottom:14px">
      <label class="chip"><input type="checkbox" id="repOnly">Only 🔁 repeat misses (${CARDS.filter(c => c.rep).length})</label>
    </div>
    <div class="row">
      <button class="btn primary" id="startBtn">Start round</button>
      <button class="btn" id="missBtn" ${last && last.missed.length ? "" : "disabled"}>Retry last round's misses (${last ? last.missed.length : 0})</button>
    </div>
  </div>
  <div class="card"><h3 style="margin-top:0">Round history</h3>${hist}</div>`;
  document.getElementById("startBtn").onclick = () => {
    const secs = [...document.querySelectorAll("input[name=sec]:checked")].map(x => x.value);
    const rep = document.getElementById("repOnly").checked;
    const deck = CARDS.filter(c => secs.includes(c.sec) && (!rep || c.rep));
    if (!deck.length) return alert("No cards match that filter.");
    start(deck, rep ? "🔁 only" : secs.length === 8 ? "All" : secs.join(""));
  };
  document.getElementById("missBtn").onclick = () => start(last.missed.map(byId).filter(Boolean), "Retry misses");
  const clr = document.getElementById("clearBtn");
  if (clr) clr.onclick = () => { if (confirm("Delete all saved rounds?")) { saveRounds([]); home(); } };
}

function start(deck, set) {
  run = { deck: shuffle(deck), i: 0, answers: [], set };
  show();
}

/* One card: two options in random order. */
function show() {
  const c = run.deck[run.i];
  run.order = Math.random() < 0.5 ? [c.ok, c.bad] : [c.bad, c.ok];
  run.picked = null;
  const done = run.answers.filter(a => a.correct).length;
  app.innerHTML = `
  <div class="card">
    <div class="meta"><span>Card ${run.i + 1} / ${run.deck.length} · ${c.id} · ${SECTIONS[c.sec]} ${c.rep ? "· 🔁" : ""}</span><span>${done} correct so far</span></div>
    <div class="bar"><i style="width:${pct(run.i, run.deck.length)}%"></i></div>
    <div class="q">${c.q}</div>
    ${run.order.map((t, k) => `<button class="opt" data-k="${k}"><b>${"AB"[k]}</b><span>${t}</span></button>`).join("")}
    <div id="fb"></div>
  </div>
  <p class="muted">Keys: <code>A</code>/<code>B</code> or <code>1</code>/<code>2</code> to pick, <code>Enter</code> for next.</p>`;
  app.querySelectorAll(".opt").forEach(b => b.onclick = () => pick(+b.dataset.k));
}

function pick(k) {
  if (run.picked !== null) return;
  const c = run.deck[run.i];
  run.picked = k;
  const correct = run.order[k] === c.ok;
  run.answers.push({ id: c.id, correct });
  app.querySelectorAll(".opt").forEach((b, j) => {
    b.disabled = true;
    if (run.order[j] === c.ok) b.classList.add("ok");
    else if (j === k) b.classList.add("no");
  });
  const last = run.i === run.deck.length - 1;
  document.getElementById("fb").innerHTML = `
    <div class="fb"><span class="v ${correct ? "ok" : "no"}">${correct ? "✅ Correct" : "❌ Trap"}</span> — ${c.why}
    <div class="tag">Source: ${c.src}</div></div>
    <div class="row" style="margin-top:12px"><button class="btn primary" id="nextBtn">${last ? "See summary" : "Next →"}</button></div>`;
  document.getElementById("nextBtn").onclick = next;
}

function next() {
  if (run.picked === null) return;
  if (++run.i < run.deck.length) show(); else summary();
}

/* Final summary: score, per-section breakdown, missed cards, round log line. Saves the round. */
function summary() {
  const total = run.answers.length;
  const score = run.answers.filter(a => a.correct).length;
  const missed = run.answers.filter(a => !a.correct).map(a => a.id);
  const rounds = loadRounds();
  rounds.push({ date: today(), set: run.set, score, total, missed });
  saveRounds(rounds);
  const rows = Object.keys(SECTIONS).map(s => {
    const a = run.answers.filter(x => x.id[0] === s);
    if (!a.length) return "";
    const ok = a.filter(x => x.correct).length;
    return `<tr><td>${s}. ${SECTIONS[s]}</td><td>${ok}/${a.length}</td><td class="${pct(ok, a.length) >= 80 ? "good" : "badc"}">${pct(ok, a.length)}%</td></tr>`;
  }).join("");
  const missList = missed.length ? missed.map(byId).map(c => `
    <div class="miss"><b>${c.id}${c.rep ? " 🔁" : ""}.</b> ${c.q}<br>
    <span class="good">✓ ${c.ok}</span><br><span class="badc">✗ ${c.bad}</span><br>
    <span class="muted">${c.why}</span> <span class="tag">(${c.src})</span></div>`).join("") : `<p class="good">No misses — clean round.</p>`;
  const logLine = `| ${rounds.length} | ${today()} | ${score}/${total} | ${missed.join(", ") || "—"} |`;
  const p = pct(score, total);
  app.innerHTML = `
  <div class="card">
    <div class="muted">Round ${rounds.length} · ${run.set}</div>
    <div class="big ${p >= 80 ? "good" : "badc"}">${score} / ${total} <small style="font-size:20px">(${p}%)</small></div>
    <p class="muted">Target ≥ 80%. ${missed.length ? `Retry the ${missed.length} missed card(s) in 2 days.` : ""}</p>
    <div class="row">
      <button class="btn primary" id="retryBtn" ${missed.length ? "" : "disabled"}>Retry missed now</button>
      <button class="btn" id="againBtn">New round</button>
    </div>
  </div>
  <div class="card"><h3 style="margin-top:0">By section</h3><table><tr><th>Section</th><th>Score</th><th>%</th></tr>${rows}</table></div>
  <div class="card"><h3 style="margin-top:0">Missed cards (${missed.length})</h3>${missList}</div>
  <div class="card"><h3 style="margin-top:0">Round log line</h3>
    <p class="muted">Paste into the table at the end of <code>aws-sap/study-progress.md</code>.</p>
    <div class="copy" id="logLine">${logLine}</div>
    <div class="row" style="margin-top:8px"><button class="btn" id="copyBtn">Copy</button></div></div>`;
  document.getElementById("retryBtn").onclick = () => start(missed.map(byId), "Retry misses");
  document.getElementById("againBtn").onclick = home;
  document.getElementById("copyBtn").onclick = e => navigator.clipboard.writeText(logLine).then(() => e.target.textContent = "Copied ✓");
  run = null;
}

document.addEventListener("keydown", e => {
  if (!run || e.target.tagName === "BUTTON" && e.key === "Enter") return; // button Enter already fires click
  const k = e.key.toLowerCase();
  if (k === "a" || k === "1") pick(0);
  else if (k === "b" || k === "2") pick(1);
  else if (k === "enter") next();
});
document.getElementById("homeBtn").onclick = () => { if (!run || confirm("Leave this round? Progress won't be saved.")) home(); };
home();
</script>
</body>
</html>
